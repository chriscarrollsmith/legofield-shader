<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Legofield Video Filter</title>
<style>
:root { color-scheme: dark; }
html, body { margin: 0; height: 100%; background: #0d1117; font-family: "IBM Plex Sans", sans-serif; }
#ui { position: fixed; top: 12px; left: 12px; z-index: 2; display: flex; gap: 8px; align-items: center; }
button { border: 0; background: #f2b705; color: #111; font-weight: 700; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
small { color: #c9d1d9; }
canvas { width: 100vw; height: 100vh; display: block; }
</style>
</head>
<body>
<div id="ui">
  <button id="startCam">Start Camera</button>
  <small>Legofield filter on webcam/video texture</small>
</div>
<video id="video" autoplay muted playsinline style="display:none"></video>
<canvas id="gl"></canvas>
<script>
const canvas = document.getElementById("gl");
const gl = canvas.getContext("webgl");
if (!gl) throw new Error("WebGL not available");
const captureMode = new URLSearchParams(window.location.search).get("capture") === "1";
if (captureMode) {
  document.getElementById("ui").style.display = "none";
}

const vsrc = `
attribute vec2 aPos;
varying vec2 vUv;
void main(){
  vUv = aPos * 0.5 + 0.5;
  gl_Position = vec4(aPos, 0.0, 1.0);
}`;

const fsrc = `
precision highp float;
uniform vec2 uResolution;
uniform float uTime;
uniform sampler2D uTex;
uniform float uHasVideo;
varying vec2 vUv;

vec2 legoCellCenterPx(vec2 fragCoord, vec2 resolution, float blocksPerWidth) {
    float c = blocksPerWidth / resolution.x;
    return floor(fragCoord * c + 0.5) / c;
}
vec2 legoCellUv(vec2 fragCoord, vec2 cellCenterPx, vec2 resolution, float blocksPerWidth) {
    float c = blocksPerWidth / resolution.x;
    return (fragCoord - cellCenterPx) * c * 2.0;
}
float legoStudRing(vec2 cellUv, float studRadius, float ringWidth) {
    float r = length(cellUv);
    return smoothstep(studRadius - ringWidth, studRadius, r)
         - smoothstep(studRadius, studRadius + ringWidth, r);
}
float legoEdgeMask(vec2 cellUv) {
    return smoothstep(0.84, 1.0, max(abs(cellUv.x), abs(cellUv.y)));
}

vec3 fallbackField(vec2 uv, float t) {
    float a = sin(uv.x * 14.0 + t * 0.7) * cos(uv.y * 11.0 - t * 0.4);
    return vec3(0.5 + 0.4 * cos(vec3(0.0, 2.1, 4.2) + a + t * 0.2));
}

void main() {
    vec2 fragCoord = gl_FragCoord.xy;
    float blocksPerWidth = 30.0;
    float studRadius = 0.60; // Canonical ratio from original Legofield.
    float ringWidth = 0.08;
    float edgeStrength = 0.52;
    float studHighlight = 0.34;
    vec2 lightDir = normalize(vec2(-0.7, 0.7));
    float outlineGray = 0.35;
    float lightArcLift = 0.30;
    float lightArcBias = 0.05;
    float lightArcStrength = 0.55;
    float shadowArcDarken = 0.45;
    float shadowArcStrength = 0.75;

    vec2 centerPx = legoCellCenterPx(fragCoord, uResolution, blocksPerWidth);
    vec2 cellUv = legoCellUv(fragCoord, centerPx, uResolution, blocksPerWidth);

    vec2 texUv = centerPx / uResolution;
    texUv.y = 1.0 - texUv.y;
    vec3 src = mix(fallbackField(texUv, uTime), texture2D(uTex, texUv).rgb, uHasVideo);

    float ring = legoStudRing(cellUv, studRadius, ringWidth);
    float edge = legoEdgeMask(cellUv);
    vec2 n2 = normalize(cellUv + vec2(1e-5));
    float lambert = max(0.0, dot(n2, lightDir));
    float side = dot(n2, lightDir);
    float litArc = ring * smoothstep(-0.15, 0.35, side);
    float shadowArc = ring * smoothstep(-0.15, 0.35, -side);

    vec3 col = src;
    vec3 outlineColor = vec3(outlineGray);
    vec3 litArcColor = clamp(src * (1.0 + lightArcLift) + vec3(lightArcBias), 0.0, 1.0);
    vec3 shadowArcColor = src * shadowArcDarken;
    col *= 1.0 + studHighlight * ring * lambert;
    col = mix(col, outlineColor, edgeStrength * edge);
    // Full-ring stud convention: bright arc on lit side, darkened arc on shadow side.
    col = mix(col, litArcColor, lightArcStrength * litArc);
    col = mix(col, shadowArcColor, shadowArcStrength * shadowArc);

    gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);
}`;

function shader(type, src){
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, shader(gl.VERTEX_SHADER, vsrc));
gl.attachShader(prog, shader(gl.FRAGMENT_SHADER, fsrc));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);

const quad = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, quad);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aPos = gl.getAttribLocation(prog, "aPos");
gl.enableVertexAttribArray(aPos);
gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

const uResolution = gl.getUniformLocation(prog, "uResolution");
const uTime = gl.getUniformLocation(prog, "uTime");
const uHasVideo = gl.getUniformLocation(prog, "uHasVideo");

const tex = gl.createTexture();
gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

const video = document.getElementById("video");
let hasVideo = 0.0;

document.getElementById("startCam").onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    video.srcObject = stream;
    await video.play();
    hasVideo = 1.0;
  } catch (e) {
    console.error(e);
  }
};

function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.floor(innerWidth * dpr);
  canvas.height = Math.floor(innerHeight * dpr);
  gl.viewport(0, 0, canvas.width, canvas.height);
}
addEventListener("resize", resize);
resize();

const t0 = performance.now();
function frame(){
  const t = (performance.now() - t0) * 0.001;
  gl.useProgram(prog);
  gl.uniform2f(uResolution, canvas.width, canvas.height);
  gl.uniform1f(uTime, t);
  gl.uniform1f(uHasVideo, hasVideo);

  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, tex);
  if (hasVideo > 0.5 && video.readyState >= 2) {
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
  } else {
    const p = new Uint8Array([30, 30, 30, 255]);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, p);
  }

  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  requestAnimationFrame(frame);
}
frame();
</script>
</body>
</html>
